[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bettercomments-cli"
version = "0.1.0"
description = "Safely rewrite verbose, multilingual code comments as concise English."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Nacho" }]
keywords = ["comments", "developer-tools", "code-quality", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["tree-sitter-language-pack>=0.9.0,<1"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pyright>=1.1.400",
  "pytest>=8.3",
  "pytest-cov>=6.0",
]

[project.scripts]
bettercomments = "bettercomments.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bettercomments"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests", "bettercomments.py"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"
